<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private — Parnell Systems</title>
<meta name="description" content="This surface is private.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{--fd:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;--fm:'Space Mono',ui-monospace,monospace;--bg:#0a0910;--panel:rgba(255,255,255,0.025);--text:#efedf6;--dim:#9a95b0;--faint:#6d6885;--border:rgba(255,255,255,0.10);--accent:#a58cff;--accent-deep:#6b46d6;--accent-glow:rgba(139,108,240,0.22);--radius:18px;}
  body{font-family:var(--fd);background:var(--bg);color:var(--text);line-height:1.6;letter-spacing:-0.01em;min-height:100vh;overflow-x:hidden;}
  a{color:inherit;}
  .glow{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .glow span{position:absolute;width:820px;height:820px;border-radius:50%;top:-340px;left:50%;margin-left:-410px;background:radial-gradient(circle,var(--accent-glow),transparent 66%);filter:blur(20px);animation:drift 24s ease-in-out infinite alternate;}
  @keyframes drift{to{transform:translate(60px,-40px) scale(1.12);}}
  .site-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;animation:fadeUp .5s ease-out both;}
  .brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;}
  .brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#0a0910;letter-spacing:-0.03em;flex-shrink:0;}
  .brand-text{font-weight:700;font-size:17px;letter-spacing:-0.02em;}
  .back-link{font-family:var(--fm);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);text-decoration:none;transition:color .2s;}
  .back-link:hover{color:var(--accent);}
  .site-footer{margin-top:3.25rem;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-family:var(--fm);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5a5570;}
  .site-footer a{color:var(--dim);text-decoration:none;transition:color .2s;}
  .site-footer a:hover{color:var(--accent);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
  .lock{width:64px;height:64px;border-radius:18px;background:rgba(165,140,255,0.12);border:1px solid rgba(165,140,255,0.25);display:flex;align-items:center;justify-content:center;font-size:1.7rem;margin:0 auto 1.6rem;animation:fadeUp .5s ease-out both;}
  .p-eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;animation:fadeUp .6s .05s ease-out both;}
  .wrap h1{font-size:clamp(2rem,6vw,3rem);font-weight:700;letter-spacing:-0.045em;margin-bottom:1rem;animation:fadeUp .6s .1s ease-out both;}
  .wrap p{color:var(--dim);font-size:1.05rem;line-height:1.7;max-width:460px;margin:0 auto 2rem;animation:fadeUp .6s .15s ease-out both;}
  .home{display:inline-flex;align-items:center;gap:9px;font-family:var(--fm);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;color:var(--dim);border:1px solid var(--border);border-radius:100px;padding:11px 20px;transition:color .2s,border-color .2s,background .2s;animation:fadeUp .6s .2s ease-out both;}
  .home:hover{color:var(--accent);border-color:rgba(165,140,255,0.4);background:rgba(165,140,255,0.08);}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><span></span></div>
<div class="wrap">
<div>
<div class="lock" aria-hidden="true">🔒</div>
<div class="p-eyebrow">Owner only</div>
<h1>This surface is private</h1>
<p>Implementation docs, platform internals, and decision records are kept out of the public portal. If you need access, get in touch.</p>
<a class="home" href="index.html">← Back to hub</a>
</div>
</div>
</body>
</html>
