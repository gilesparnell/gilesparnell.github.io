<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private content — Parnell Systems</title>
  <meta name="description" content="Some project documentation is only available to project owners.">

  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">

  <style>
    /* =============================================
       PARNELL SYSTEMS — Private content notice
       Deep Ocean Tech (matches hub index.html)
       ============================================= */

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font-display: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-deep:    #0a0c10;
      --text-primary:   #e8eaf0;
      --text-secondary: #8b92a8;
      --text-tertiary:  #4a5068;
      --accent:         #38bfa0;
      --accent-muted:   rgba(56,191,160,0.15);
      --border:         rgba(255,255,255,0.06);
      --radius: 20px;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.6;
      letter-spacing: -0.01em;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---- Mesh background ---- */
    .mesh-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .mesh-bg .blob { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
    .mesh-bg .blob:nth-child(1) { width: 650px; height: 650px; background: hsla(168,55%,32%,0.35); top: -12%; left: -8%; animation: drift1 20s ease-in-out infinite alternate; }
    .mesh-bg .blob:nth-child(2) { width: 580px; height: 580px; background: hsla(215,55%,28%,0.28); bottom: -18%; left: 25%; animation: drift3 28s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(90px,70px) scale(1.08); } }
    @keyframes drift3 { to { transform: translate(50px,-60px) scale(1.12); } }

    /* ---- Card ---- */
    .notice {
      position: relative; z-index: 1;
      max-width: 520px; margin: 2rem;
      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.75rem 2.5rem;
      text-align: center;
      animation: fadeUp 0.6s ease-out both;
    }
    .notice::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
      pointer-events: none;
    }
    .notice-icon {
      width: 60px; height: 60px; border-radius: 16px;
      background: var(--accent-muted);
      border: 1px solid rgba(56,191,160,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; margin: 0 auto 1.5rem;
    }
    .notice h1 {
      font-family: var(--font-display); font-weight: 900;
      font-size: 1.8rem; letter-spacing: -0.04em; line-height: 1.1;
      margin-bottom: 0.9rem;
    }
    .notice p {
      color: var(--text-secondary); font-size: 0.95rem; line-height: 1.7;
      margin-bottom: 1.75rem;
    }
    .notice a.home {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-display); font-weight: 700; font-size: 0.9rem;
      color: var(--accent); text-decoration: none;
      padding: 0.7rem 1.4rem; border-radius: 12px;
      background: rgba(56,191,160,0.08);
      border: 1px solid rgba(56,191,160,0.2);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .notice a.home:hover {
      background: rgba(56,191,160,0.15);
      border-color: rgba(56,191,160,0.3);
      transform: translateX(3px);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="mesh-bg" aria-hidden="true">
  <div class="blob"></div><div class="blob"></div>
</div>

<div class="notice">
  <div class="notice-icon">🔒</div>
  <h1>This content is private</h1>
  <p>Some project documentation and source code is only available to project owners. Public case studies cover the outcome and the high-level approach; the detailed implementation is kept private.</p>
  <a class="home" href="index.html">&larr; Back to Parnell Systems</a>
</div>

</body>
</html>
