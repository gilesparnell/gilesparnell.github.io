<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Diagram of point-to-point data silo sprawl">
<rect width="900" height="420" fill="#f7f9fa"/>
        <defs>
          <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#c9445a" stroke-width="1.4"/>
          </marker>
        </defs>
        <!-- consumers row -->
        <g>
          <rect x="60" y="24" width="180" height="56" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="150" y="48" fill="#0e2233" font-size="14" font-weight="600" text-anchor="middle">Analytics / BI</text>
          <text x="150" y="66" fill="#4a5d6b" font-size="11" text-anchor="middle">reports, dashboards</text>

          <rect x="360" y="24" width="180" height="56" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="450" y="48" fill="#0e2233" font-size="14" font-weight="600" text-anchor="middle">Data science / AI</text>
          <text x="450" y="66" fill="#4a5d6b" font-size="11" text-anchor="middle">models, GenAI</text>

          <rect x="660" y="24" width="180" height="56" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="750" y="48" fill="#0e2233" font-size="14" font-weight="600" text-anchor="middle">Data products</text>
          <text x="750" y="66" fill="#4a5d6b" font-size="11" text-anchor="middle">customer-facing feeds</text>
        </g>

        <!-- spaghetti connectors -->
        <g stroke="#c9445a" stroke-width="1.3" fill="none" opacity="0.7">
          <path d="M110,80 C90,190 120,230 150,300" marker-end="url(#arrR)"/>
          <path d="M150,80 C210,180 320,180 385,300" marker-end="url(#arrR)"/>
          <path d="M190,80 C300,200 520,170 610,300" marker-end="url(#arrR)"/>
          <path d="M420,80 C330,190 220,210 175,300" marker-end="url(#arrR)"/>
          <path d="M450,80 C450,180 420,220 400,300" marker-end="url(#arrR)"/>
          <path d="M480,80 C560,180 640,200 660,300" marker-end="url(#arrR)"/>
          <path d="M720,80 C620,200 480,220 420,300" marker-end="url(#arrR)"/>
          <path d="M760,80 C780,180 800,220 810,300" marker-end="url(#arrR)"/>
          <path d="M700,80 C520,240 260,240 190,300" marker-end="url(#arrR)"/>
        </g>
        <rect x="180" y="192" width="540" height="22" rx="6" fill="#f7f9fa" opacity="0.92"/>
        <text x="450" y="208" fill="#c9445a" font-size="12.5" font-weight="600" text-anchor="middle">every consumer × every source = its own pipeline, its own copy, its own rules</text>

        <!-- sources row -->
        <g>
          <rect x="60" y="300" width="140" height="86" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="130" y="326" fill="#0e2233" font-size="13.5" font-weight="600" text-anchor="middle">Warehouse</text>
          <text x="130" y="344" fill="#4a5d6b" font-size="10.5" text-anchor="middle">finance data,</text>
          <text x="130" y="359" fill="#4a5d6b" font-size="10.5" text-anchor="middle">nightly batch</text>

          <rect x="235" y="300" width="140" height="86" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="305" y="326" fill="#0e2233" font-size="13.5" font-weight="600" text-anchor="middle">Data lake</text>
          <text x="305" y="344" fill="#4a5d6b" font-size="10.5" text-anchor="middle">raw files, logs,</text>
          <text x="305" y="359" fill="#4a5d6b" font-size="10.5" text-anchor="middle">unclear ownership</text>

          <rect x="410" y="300" width="140" height="86" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="480" y="326" fill="#0e2233" font-size="13.5" font-weight="600" text-anchor="middle">Legacy on-prem</text>
          <text x="480" y="344" fill="#4a5d6b" font-size="10.5" text-anchor="middle">mainframe extracts,</text>
          <text x="480" y="359" fill="#4a5d6b" font-size="10.5" text-anchor="middle">Java ETL jobs</text>

          <rect x="585" y="300" width="140" height="86" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="655" y="326" fill="#0e2233" font-size="13.5" font-weight="600" text-anchor="middle">SaaS apps</text>
          <text x="655" y="344" fill="#4a5d6b" font-size="10.5" text-anchor="middle">CRM, ERP,</text>
          <text x="655" y="359" fill="#4a5d6b" font-size="10.5" text-anchor="middle">market feeds</text>

          <rect x="760" y="300" width="110" height="86" rx="10" fill="#ffffff" stroke="#b7c3cc" stroke-width="1.3"/>
          <text x="815" y="326" fill="#0e2233" font-size="13.5" font-weight="600" text-anchor="middle">Streams</text>
          <text x="815" y="344" fill="#4a5d6b" font-size="10.5" text-anchor="middle">events,</text>
          <text x="815" y="359" fill="#4a5d6b" font-size="10.5" text-anchor="middle">real-time ticks</text>
        </g>
      </svg>