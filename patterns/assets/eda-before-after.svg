<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before: five systems wired directly to each other in a tangle. After: the same five systems connected through one event broker" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ea" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#c9445a"/>
    </marker>
    <marker id="eg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#0e8f83"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="480" rx="18" fill="#f7f9fa" stroke="#dde5ea"/>

  <!-- ============ LEFT: point-to-point tangle ============ -->
  <g transform="translate(14,14)">
    <rect x="0" y="0" width="434" height="452" rx="14" fill="#ffffff" stroke="#dde5ea"/>
    <text x="20" y="32" font-size="14.5" font-weight="700" fill="#0e2233">Before — everyone calls everyone</text>
    <text x="20" y="52" font-size="11.5" fill="#7b8b96">every connection is bespoke code someone has to maintain</text>

    <!-- 5 systems arranged in a ring -->
    <rect x="160" y="80" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="217" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Orders</text>

    <rect x="30" y="180" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="87" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Inventory</text>

    <rect x="290" y="180" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="347" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Payments</text>

    <rect x="70" y="320" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="127" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Shipping</text>

    <rect x="250" y="320" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="307" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Analytics</text>

    <!-- tangle of direct connections -->
    <line x1="160" y1="108" x2="112" y2="178" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="274" y1="108" x2="324" y2="178" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="144" y1="196" x2="288" y2="196" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="288" y1="210" x2="146" y2="210" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="97" y1="220" x2="120" y2="316" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="345" y1="220" x2="318" y2="316" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="184" y1="336" x2="248" y2="336" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="217" y1="120" x2="299" y2="318" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="205" y1="120" x2="133" y2="316" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>
    <line x1="120" y1="220" x2="284" y2="322" stroke="#c9445a" stroke-width="1.2" marker-end="url(#ea)"/>

    <text x="217" y="410" text-anchor="middle" font-size="11.5" fill="#c9445a" font-weight="600">5 systems → 10 possible connections. 20 systems → 190.</text>
    <text x="217" y="428" text-anchor="middle" font-size="11" fill="#7b8b96">every new system means wiring it to everything that already exists</text>
  </g>

  <!-- ============ RIGHT: broker ============ -->
  <g transform="translate(472,14)">
    <rect x="0" y="0" width="434" height="452" rx="14" fill="#ffffff" stroke="#dde5ea"/>
    <text x="20" y="32" font-size="14.5" font-weight="700" fill="#0e2233">After — everyone posts to the log</text>
    <text x="20" y="52" font-size="11.5" fill="#7b8b96">systems announce what happened; whoever cares listens</text>

    <!-- broker in the middle -->
    <rect x="147" y="190" width="140" height="80" rx="12" fill="#e8f5f3" stroke="#0e8f83" stroke-width="1.5"/>
    <line x1="167" y1="212" x2="267" y2="212" stroke="#0e8f83" stroke-width="2.5" opacity="0.5"/>
    <line x1="167" y1="228" x2="267" y2="228" stroke="#0e8f83" stroke-width="2.5" opacity="0.5"/>
    <line x1="167" y1="244" x2="267" y2="244" stroke="#0e8f83" stroke-width="2.5" opacity="0.5"/>
    <text x="217" y="292" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a6e65">EVENT BROKER</text>

    <!-- same 5 systems around it -->
    <rect x="160" y="80" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="217" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Orders</text>
    <line x1="217" y1="120" x2="217" y2="184" stroke="#0e8f83" stroke-width="1.4" marker-end="url(#eg)"/>

    <rect x="20" y="205" width="110" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="75" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Inventory</text>
    <line x1="141" y1="218" x2="132" y2="218" stroke="#0e8f83" stroke-width="1.4" marker-end="url(#eg)"/>
    <line x1="132" y1="240" x2="141" y2="240" stroke="#0e8f83" stroke-width="1.4" marker-end="url(#eg)"/>

    <rect x="304" y="205" width="110" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="359" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Payments</text>
    <line x1="293" y1="218" x2="302" y2="218" stroke="#0e8f83" stroke-width="1.4" marker-end="url(#eg)"/>
    <line x1="302" y1="240" x2="293" y2="240" stroke="#0e8f83" stroke-width="1.4" marker-end="url(#eg)"/>

    <rect x="70" y="330" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="127" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Shipping</text>
    <line x1="170" y1="274" x2="140" y2="326" stroke="#0e8f83" stroke-width="1.4" marker-end="url(#eg)"/>

    <rect x="250" y="330" width="114" height="40" rx="9" fill="#ffffff" stroke="#0e2233" stroke-width="1.3"/>
    <text x="307" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#0e2233">Analytics</text>
    <line x1="264" y1="274" x2="294" y2="326" stroke="#0e8f83" stroke-width="1.4" marker-end="url(#eg)"/>

    <text x="217" y="410" text-anchor="middle" font-size="11.5" fill="#0a6e65" font-weight="600">5 systems → 5 connections. 20 systems → 20.</text>
    <text x="217" y="428" text-anchor="middle" font-size="11" fill="#7b8b96">a new system just plugs into the broker — nothing else changes</text>
  </g>
</svg>
